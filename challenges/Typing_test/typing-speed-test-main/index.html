<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <!--css file-->
    <title>Typing Speed Test</title>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo"></div>
        <div class="Best">
          <img src="./assets/images/icon-personal-best.svg" alt="Best Score" />
          <span class="label">Best:</span>
          <span class="value">0 WPM</span>
        </div>
      </header>

      <nav>
        <div class="analysis">
          <div class="stat">
            <p>WPM:</p>
            <span>0</span>
          </div>
          <div class="stat Accuracy">
            <p>Accuracy:</p>
            <span>0%</span>
          </div>
          <div class="stat">
            <p>Time:</p>
            <span>00:00</span>
          </div>
        </div>

        <div class="select">
          <div class="custom-select-wrapper">
            <button class="select-button">
              Hard <span class="arrow"></span>
            </button>
            <ul class="select-options">
              <li>
                <input type="radio" name="level" id="easy" />
                <label for="easy">Easy</label>
              </li>
              <li>
                <input type="radio" name="level" id="medium" />
                <label for="medium">Medium</label>
              </li>
              <li>
                <input type="radio" name="level" id="hard" checked />
                <label for="hard">Hard</label>
              </li>
            </ul>
          </div>

          <div class="custom-select-wrapper">
            <button class="select-button">
              Timed (60s) <span class="arrow"></span>
            </button>
            <ul class="select-options">
              <li>
                <input type="radio" name="mode" id="timed" checked />
                <label for="timed">Timed (60s)</label>
              </li>
              <li>
                <input type="radio" name="mode" id="passage" />
                <label for="passage">passage</label>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>

    <script src="script.js"></script>
  </body>
</html>
